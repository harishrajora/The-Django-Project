{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        /* Replaces that annoying white or black flash at the beggining with the correct theme color*/
        :root{ --bg-color: rgb(255, 255, 255); }
        @media (prefers-color-scheme: dark) { :root{--bg-color: rgb(25, 25, 25); }}
        body{ background-color: var(--bg-color);}
    </style>

    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Django Dersleri{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<style>

/* ##############################################################*/
/* Root is done here because load static only works in html files */
/* You must provide a dark and light version of an icon!! */
/* ##############################################################*/

/* ######################################################################*/
/* All related dark and light mode colors are in theme.css and style.css */
/* ######################################################################*/

</style>


<body>
    {% include "header.html" %}
    {% include 'messages.html' %}

    {% block body %}

    {% endblock %}

    <script src="{% static '/js/popper.min.js' %}"></script>
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>

</body>
</html>
