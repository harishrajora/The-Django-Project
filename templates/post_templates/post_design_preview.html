{% block body%}
<div class="container">             
    <div class="row row-cols-1 row-cols-md-3" style="margin-top: 1rem;">
        <div class="col d-flex mt-3">
            <div class="card post_body w-100 d-flex flex-column justify-content-between" style="height: 100%;"> 
                <div class="caption flex-grow-1 d-flex flex-column">
                    
                    <div style="position: relative; flex-grow: 1; overflow: hidden; overflow-wrap: break-word;">
                        <a href=""><span class="div_link"></span></a>

                        <div class="card-header mb-2">
                            <h3 class="post_title">
                                Post title
                            </h3>
                            <h6 class="post_title">
                                OP: {{ request.user }}
                            </h6>
                        </div>                      

                        <div class="card-header mt-2" style="position: relative;">
                            BLABABABA
                        </div>

                    </div>

                    <div class="d-flex mt-auto card-header" style="margin: 0.2rem;"> <!-- post footer -->

                        <a href="" role="button"><img class="scale-hover arrow_upvote" alt=""></a> 0

                        <img class="ms-2 eye" alt=""> 0
                        <div class="ms-auto">
                            <a href=""><img class="edit"  alt="Edit Post"></a>
                            <a href="" data-bs-toggle="modal" data-bs-target="#modal_delete"><img class="delete" alt="Delete Post"></a>
                        </div>

                        <div class="ms-auto">
                            <a href="" data-bs-toggle="modal" data-bs-target="#modal_report_"><img class="flag" alt="Report Post"></a>
                            <small data-toggle="tooltip" data-placement="top">0s Ago</small>
                        </div>             
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</div>

{% endblock%}
